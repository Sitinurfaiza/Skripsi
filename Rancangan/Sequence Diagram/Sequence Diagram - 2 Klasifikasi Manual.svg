<text x="377.1428571428571" y="304" text-anchor="middle" font-size="10.5" fill="#222">7: label (Layak/Tidak Layak) + confidence</text>
<line x1="277.42857142857144" y1="350" x2="899.7142857142857" y2="350" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="588.5714285714286" y="344" text-anchor="middle" font-size="10.5" fill="#222">8: commitPrediction([hasil], 'manual')</text>
<line x1="911.7142857142857" y1="385" x2="1111.142857142857" y2="385" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="1011.4285714285713" y="379" text-anchor="middle" font-size="10.5" fill="#222">9: dispatch({type:'addPrediction', prediction})</text>

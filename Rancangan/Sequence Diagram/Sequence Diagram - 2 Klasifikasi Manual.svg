<text x="271.42857142857144" y="145" text-anchor="middle" font-size="10" fill="#666" font-style="italic">2: validate(form) — cek 9 field wajib</text>
<text x="271.42857142857144" y="170" text-anchor="middle" font-size="10" fill="#666" font-style="italic">3: bangun CustomerRow (id_pelanggan: MAN-xxxxxx)</text>
<line x1="277.42857142857144" y1="205" x2="476.85714285714283" y2="205" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>

<line x1="66" y1="110" x2="461.5" y2="110" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="263.75" y="104" text-anchor="middle" font-size="10.5" fill="#222">1: pilih file .csv</text>
<line x1="461.5" y1="145" x2="269.75" y2="145" stroke="#333" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="365.625" y="139" text-anchor="middle" font-size="10.5" fill="#222">2: onFile(file) → set state file</text>
<line x1="66" y1="180" x2="257.75" y2="180" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="161.875" y="174" text-anchor="middle" font-size="10.5" fill="#222">3: klik 'Jalankan Klasifikasi' → runBatch()</text>
<line x1="269.75" y1="215" x2="665.25" y2="215" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="467.5" y="209" text-anchor="middle" font-size="10.5" fill="#222">4: parseCustomerCsv(file)</text>
<text x="671.25" y="245" text-anchor="middle" font-size="10" fill="#666" font-style="italic">5: parse header + baris CSV → CustomerRow[]</text>
<line x1="665.25" y1="280" x2="269.75" y2="280" stroke="#333" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="467.5" y="274" text-anchor="middle" font-size="10.5" fill="#222">6: rows: CustomerRow[] (return)</text>
<line x1="269.75" y1="315" x2="869" y2="315" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="569.375" y="309" text-anchor="middle" font-size="10.5" fill="#222">7: predictRows(rows)</text>
<line x1="881" y1="350" x2="1072.75" y2="350" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="976.875" y="344" text-anchor="middle" font-size="10.5" fill="#222">8: loop: predictRow(row) → scoreRow(row)</text>
<line x1="1072.75" y1="385" x2="881" y2="385" stroke="#333" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="976.875" y="379" text-anchor="middle" font-size="10.5" fill="#222">9: label + confidence per baris (return)</text>
<line x1="869" y1="420" x2="269.75" y2="420" stroke="#333" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="569.375" y="414" text-anchor="middle" font-size="10.5" fill="#222">10: PredictionResultRow[] (hasil batch)</text>
<line x1="269.75" y1="460" x2="1276.5" y2="460" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="773.125" y="454" text-anchor="middle" font-size="10.5" fill="#222">11: commitPrediction(hasil, 'batch', file.name)</text>
<line x1="1288.5" y1="495" x2="1480.25" y2="495" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="1384.375" y="489" text-anchor="middle" font-size="10.5" fill="#222">12: dispatch({type:'addPrediction'}) + addActivity('batch ...')</text>
<text x="1486.25" y="520" text-anchor="middle" font-size="10" fill="#666" font-style="italic">13: persist ke localStorage (store-v1)</text>
<line x1="1288.5" y1="560" x2="1684" y2="560" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="1486.25" y="554" text-anchor="middle" font-size="10.5" fill="#222">14: router.push('/klasifikasi/hasil/{id}')</text>
<line x1="1684" y1="595" x2="1492.25" y2="595" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="1588.125" y="589" text-anchor="middle" font-size="10.5" fill="#222">15: baca prediction batch dari Store</text>
<line x1="1684" y1="630" x2="66" y2="630" stroke="#333" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="875" y="624" text-anchor="middle" font-size="10.5" fill="#222">16: render ringkasan (jumlah Layak/Tidak Layak) + tabel hasil</text>

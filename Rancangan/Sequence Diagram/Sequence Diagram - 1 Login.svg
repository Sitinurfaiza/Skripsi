<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1300" height="600" fill="#ffffff"/>
<text x="650" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Sequence Diagram — Login</text>
<line x1="60" y1="94" x2="60" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="296" y1="94" x2="296" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="532" y1="94" x2="532" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="768" y1="94" x2="768" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="1004" y1="94" x2="1004" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="1240" y1="94" x2="1240" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="-35" y="40" width="190" height="44" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="60" y="66" text-anchor="middle" font-size="11.5" fill="#222">User</text>
<rect x="201" y="40" width="190" height="44" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="296" y="59" text-anchor="middle" font-size="11.5" fill="#222">LoginPage</text>
<text x="296" y="73" text-anchor="middle" font-size="11.5" fill="#222">(app/(auth)/login)</text>
<rect x="437" y="40" width="190" height="44" rx="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="532" y="59" text-anchor="middle" font-size="11.5" fill="#222">lib/auth.ts</text>
<text x="532" y="73" text-anchor="middle" font-size="11.5" fill="#222">(loginDummy)</text>
<rect x="673" y="40" width="190" height="44" rx="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="768" y="66" text-anchor="middle" font-size="11.5" fill="#222">Next Router</text>
<rect x="909" y="40" width="190" height="44" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="1004" y="59" text-anchor="middle" font-size="11.5" fill="#222">proxy.ts</text>
<text x="1004" y="73" text-anchor="middle" font-size="11.5" fill="#222">(route guard)</text>
<rect x="1145" y="40" width="190" height="44" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="1240" y="66" text-anchor="middle" font-size="11.5" fill="#222">Dashboard Page</text>
<rect x="55" y="104" width="10" height="342" fill="#ffffff" stroke="#666" stroke-width="1"/>
<rect x="291" y="104" width="10" height="187" fill="#ffffff" stroke="#666" stroke-width="1"/>
<rect x="527" y="204" width="10" height="47" fill="#ffffff" stroke="#666" stroke-width="1"/>
<rect x="763" y="279" width="10" height="52" fill="#ffffff" stroke="#666" stroke-width="1"/>
<rect x="999" y="319" width="10" height="87" fill="#ffffff" stroke="#666" stroke-width="1"/>
<rect x="1235" y="394" width="10" height="52" fill="#ffffff" stroke="#666" stroke-width="1"/>
<line x1="66" y1="110" x2="290" y2="110" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="178" y="104" text-anchor="middle" font-size="10.5" fill="#222">1: isi email + password, submit</text>
<text x="296" y="150" text-anchor="middle" font-size="10" fill="#666" font-style="italic">2: validasi form (email &amp; password terisi)</text>
<text x="296" y="175" text-anchor="middle" font-size="10" fill="#666" font-style="italic">3: bandingkan dgn ADMIN_USER / ADMIN_PASSWORD (seed.ts)</text>
<line x1="302" y1="210" x2="526" y2="210" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="414" y="204" text-anchor="middle" font-size="10.5" fill="#222">4: loginDummy() — set cookie subsidi_session</text>
<line x1="526" y1="245" x2="302" y2="245" stroke="#333" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="414" y="239" text-anchor="middle" font-size="10.5" fill="#222">5: cookie tersimpan (return)</text>
<line x1="302" y1="285" x2="762" y2="285" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="532" y="279" text-anchor="middle" font-size="10.5" fill="#222">6: router.push('/dashboard') + router.refresh()</text>
<line x1="774" y1="325" x2="998" y2="325" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="886" y="319" text-anchor="middle" font-size="10.5" fill="#222">7: navigasi ke /dashboard</text>
<text x="1004" y="360" text-anchor="middle" font-size="10" fill="#666" font-style="italic">8: cek cookie subsidi_session pada request</text>
<line x1="1010" y1="400" x2="1234" y2="400" stroke="#333" stroke-width="1.3" marker-end="url(#arrowBlock)"/>
<text x="1122" y="394" text-anchor="middle" font-size="10.5" fill="#222">9: cookie valid → izinkan (lanjutkan ke route)</text>
<line x1="1234" y1="440" x2="66" y2="440" stroke="#333" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="650" y="434" text-anchor="middle" font-size="10.5" fill="#222">10: render Dashboard</text>
<text x="296" y="480" text-anchor="middle" font-size="10" fill="#666" font-style="italic">11: [alt] kredensial salah → setError('Email atau password salah. Coba lagi.')</text>
<defs>
    <marker id="arrowBlock" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowOpen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#333" stroke-width="1"/>
    </marker>
  </defs>
</svg>